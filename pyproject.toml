[project]
name = "ai-quota-swap"
version = "0.1.0"
description = "Claude Code and Codex account switcher: multiple accounts, live 5-hour and weekly quota, auto-switch before usage limits, usage resets, token costs, terminal dashboard, macOS menu bar"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.8,<9",
    "truststore>=0.10.4",
    # Codex compresses idle session files with zstd; the standard library reads
    # it from Python 3.14 on.
    "zstandard>=0.22; python_version < '3.14'",
]
authors = [{name = "seangeng"}]
license = {text = "MIT"}
keywords = [
    "claude",
    "claude-code",
    "anthropic",
    "codex",
    "codex-cli",
    "openai-codex",
    "account-switcher",
    "multi-account",
    "claude-max",
    "auto-switch",
    "usage-limits",
    "rate-limit",
    "quota",
    "usage-tracker",
    "usage-tracking",
    "token-usage",
    "cost-tracking",
    "api-key",
    "cli",
    "tui",
    "menubar",
    "macos",
    "claude-swap",
    "cswap",
    "qswap",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]

[project.optional-dependencies]
# rumps needs PyObjC, which builds only on macOS. The marker lets one install
# line with the extra work on Linux and Windows too; there it adds nothing.
menubar = ["rumps>=0.4.0; sys_platform == 'darwin'"]

[project.urls]
Homepage = "https://github.com/seangeng/ai-quota-swap"
Documentation = "https://github.com/seangeng/ai-quota-swap/tree/main/docs"
Repository = "https://github.com/seangeng/ai-quota-swap"
Changelog = "https://github.com/seangeng/ai-quota-swap/blob/main/CHANGELOG.md"
Issues = "https://github.com/seangeng/ai-quota-swap/issues"

[project.scripts]
ai-quota-swap = "ai_quota_swap.entry:main"
qswap = "ai_quota_swap.entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_quota_swap"]

# The sdist carries the source, the tests and what they need (the demo
# harness's code, scripts/settings_doc.py, the Markdown docs), not the
# screenshots, recordings and rendered pages the harness made, nor CI files.
[tool.hatch.build.targets.sdist]
exclude = [
    "/assets",
    "/docs/shots",
    "/.github",
    "/.python-version",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.5",
    "ruff>=0.17.4",
    "textual-serve>=1.1.3",
    "time-machine>=3.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Parallel by default. Most tests spend their time waiting (file locks,
# subprocess fakes, Textual pilots) rather than computing, and no single test
# dominates, so running them one at a time mostly leaves the machine idle.
# `auto` gives each machine, from a 2-core CI runner to a workstation, one
# worker per core. `loadgroup` honours `xdist_group` marks, which keep the
# real-Keychain tests on one worker (see tests/conftest.py).
addopts = "-n auto --dist loadgroup"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "no_keychain_fake: opt out of the autouse in-memory Keychain guard (test mocks subprocess itself, or runs against a temp keychain on GitHub Actions)",
    "no_oauth_profile_fake: opt out of the autouse fetch_oauth_profile stub (test exercises fetch_oauth_profile itself against a mocked urlopen)",
    "allow_network: lift the global network block for this test (it truly needs a real outbound connection)",
    "launchctl_subprocess_fake: the test fakes subprocess.run, the layer launch_agent._launchctl calls, so the launchd guard leaves _launchctl real; the audit hook still refuses to start launchctl (see tests/conftest.py)",
]

# `uv run ruff check` lints; CI runs it. Formatting (`ruff format`) and import
# sorting are not enforced.
[tool.ruff.lint]
# Pyflakes (F) and ruff's default pycodestyle errors (E4 imports, E7
# statements, E9 syntax), which include the E402 and E731 that `# noqa`
# comments name. Not selected because the current code would need edits:
# E401, E702, E731, E741, BLE (flake8-blind-except) and PLC (pylint
# conventions, mostly PLC0415). Enable one once the code passes it.
select = ["F", "E4", "E7", "E9"]
ignore = ["E401", "E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# Pyflakes findings that predate the linter, recorded per file so every other
# file gets the full check. Fix a file, then delete its entry.
"src/ai_quota_swap/admin_api.py" = ["F401"]
"src/ai_quota_swap/credentials.py" = ["F401"]
"src/ai_quota_swap/models.py" = ["F401"]
"src/ai_quota_swap/poll_policy.py" = ["F841"]
"src/ai_quota_swap/switcher.py" = ["F401", "F821"]
"tests/conftest.py" = ["F401"]
"tests/test_account_policy_values.py" = ["F401"]
"tests/test_admin_api.py" = ["F401"]
"tests/test_api_org_cli.py" = ["F401"]
"tests/test_autoswitch_account_threshold.py" = ["F401"]
"tests/test_login_expiry.py" = ["F401", "F811"]
"tests/test_macos_keychain.py" = ["F401"]
"tests/test_process_detection.py" = ["F401"]
"tests/test_reset_kinds.py" = ["F811"]
"tests/test_session.py" = ["F841"]
"tests/test_switcher.py" = ["F401", "F841"]
"tests/test_tui_policy_display.py" = ["F811"]
"tests/test_update_check.py" = ["F401"]
"tests/test_worker_gc_freeze.py" = ["F401"]
