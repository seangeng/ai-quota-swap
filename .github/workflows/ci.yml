name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (ubuntu, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lowest supported version, and the one .python-version pins for
        # development.
        python-version: ['3.12', '3.14']

    steps:
      - uses: actions/checkout@v4

      # uv (not pip) so the PEP 735 dev dependency-group — pytest,
      # pytest-asyncio — installs from the committed lockfile, same as local
      # development.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        # The rule selection and its reasons are in pyproject.toml.
        run: uv run ruff check --output-format=github

  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        # Includes the TUI tests: the Textual TUI (unlike the old curses one)
        # runs on stock Windows, and this job is the proof.
        run: uv run pytest

  # The id `macos-keychain` dates from when this job ran only the Keychain
  # tests; it now runs the whole suite.
  macos-keychain:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run the whole suite (not only the Keychain files)
        # THE NARROW SELECTION WAS A BLIND SPOT, not a saving. Three cases
        # failed on macOS -- one asserting the Linux XDG layout, two because a
        # usable Keychain takes the write and leaves no `.enc` to chmod --
        # while every job stayed green, because this job never ran them. A merge that
        # restores a two-file selection here re-opens that hole invisibly:
        # those cases pass now, they would simply stop running.
        #
        # faulthandler dumps every thread's stack past the budget, the only
        # clue when a `security` call blocks on an invisible SecurityAgent
        # dialog. pyproject sets no faulthandler keys, so this `-o` is the
        # only thing setting the budget, and the dump does not abort the run.
        # `timeout-minutes` is the backstop.
        timeout-minutes: 15
        run: uv run pytest -o faulthandler_timeout=600

      - name: Draw the menu bar's usage chart off screen (AppKit)
        # The suite above runs without the menubar extra, so the drawing
        # test skips there. This step adds the extra at the versions in
        # uv.lock (rumps and the AppKit bindings it brings), and
        # QSWAP_TEST_REQUIRE_APPKIT turns the test's skip into a plain
        # import, so a broken AppKit fails the step. The test draws into a
        # bitmap: no window, no application, no run loop.
        timeout-minutes: 5
        env:
          QSWAP_TEST_REQUIRE_APPKIT: "1"
        run: uv run --locked --extra menubar pytest tests/test_menubar_chart_view.py -n0 -o faulthandler_timeout=120
