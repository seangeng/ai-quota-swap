name: Publish to PyPI

# Runs when a GitHub release is published. PyPI trusts this workflow through
# trusted publishing (no token is stored anywhere): the project's publisher on
# PyPI must name this repository, this file (publish.yml) and the `pypi`
# environment. CONTRIBUTING.md has the release steps.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ai-quota-swap
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # pyproject.toml can carry the version before the tree is ready (it said
      # 0.1.0 long before 0.1.0 was prepared), so the version check alone can
      # pass on a tree that still says the package is unreleased. Preparing a
      # release renames `## Unreleased` in CHANGELOG.md to the version
      # (CONTRIBUTING.md), so that heading must be there too.
      - name: Check the release tag matches the package version and changelog
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG does not match version $version in pyproject.toml"
            exit 1
          fi
          if ! grep -qx "## $version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi

      - name: Install build dependencies
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
