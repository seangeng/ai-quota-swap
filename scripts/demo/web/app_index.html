<!DOCTYPE html>
<html lang="en">
  <!--
    textual-serve page for the demo harness: the qswap dashboard in a
    terminal window that matches the CLI shots. Replaces textual-serve's
    stock page so nothing loads from outside this server (the stock page
    pulls Roboto Mono from Google Fonts; here it comes from textual-serve's
    own static files). Query: ?fontsize=18&w=1176&h=620&theme=dark&stage=1
    stage=1 centres the window on a dark backdrop, for video recordings.
  -->
  <head>
    <meta charset="utf-8" />
    <title>{{ application.name }}</title>
    <link rel="stylesheet" href="{{ config.static.url }}css/xterm.css" />
    <style>
      @font-face {
        font-family: "Roboto Mono";
        src: url("{{ config.static.url }}fonts/RobotoMono-VariableFont_wght.ttf") format("truetype");
        font-weight: 100 700;
        font-style: normal;
      }
      :root {
        --bg: #0f1117; --chrome: #161922; --chrome-fg: #8a8fa3; --border: #1f2330;
      }
      :root.light {
        --bg: #f7f8fc; --chrome: #eceef5; --chrome-fg: #565c70; --border: #dde1ec;
      }
      html, body { margin: 0; padding: 0; background: transparent; }
      body { display: flex; justify-content: center; }
      :root.stage, :root.stage body { height: 100%; }
      :root.stage body {
        align-items: center;
        background: radial-gradient(ellipse at 50% 40%, #26211d 0%, #0d0d0e 70%);
      }
      :root.stage.light body { background: radial-gradient(ellipse at 50% 40%, #fffaf2 0%, #e9e3d8 75%); }
      :root.stage .window { box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.3); }
      /* Recordings are keyboard-only: LittleDemo's pointer overlay would sit
         idle mid-frame, and its key overlay shows only some keys (Escape,
         not the letters typed), so the stage hides both. */
      :root.stage #__ld_cursor, :root.stage #__demo-cursor,
      :root.stage #__demo-keys { display: none !important; }
      .window {
        box-sizing: border-box; overflow: hidden; background: var(--bg);
        border: 1px solid var(--border); border-radius: 12px; width: 1200px;
      }
      .titlebar {
        position: relative; height: 40px; display: flex; align-items: center;
        background: var(--chrome); border-bottom: 1px solid var(--border);
      }
      .dots { display: flex; gap: 8px; padding-left: 16px; }
      .dots i { display: block; width: 12px; height: 12px; border-radius: 50%; }
      .dots i:nth-child(1) { background: #ff5f57; }
      .dots i:nth-child(2) { background: #febc2e; }
      .dots i:nth-child(3) { background: #28c840; }
      .title {
        position: absolute; left: 0; right: 0; text-align: center; pointer-events: none;
        font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color: var(--chrome-fg);
      }
      .body { padding: 10px 12px 12px; background: var(--bg); }
      #terminal { width: 1176px; height: 700px; background: var(--bg); }
      #terminal .xterm-viewport { background: var(--bg) !important; overflow: hidden !important; }
      .textual-terminal { opacity: 0; transition: opacity 0.2s ease-out; }
      body.-first-byte .textual-terminal { opacity: 1; }
      .closed { display: none; font: 14px -apple-system, system-ui, sans-serif; color: var(--chrome-fg); padding: 24px; }
      body.-closed .closed { display: block; }
    </style>
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        if (q.get("theme") === "light") document.documentElement.classList.add("light");
        if (q.get("stage") === "1") document.documentElement.classList.add("stage");
        window.__qswapSize = { w: parseInt(q.get("w") || "1176", 10), h: parseInt(q.get("h") || "700", 10) };
      })();
      function getStartUrl() { return location.pathname + location.search; }
      async function refresh() { location.href = getStartUrl(); }
    </script>
    <script src="{{ config.static.url }}js/textual.js"></script>
  </head>
  <body data-pingurl="{{ ping_url }}">
    <div class="window" id="window">
      <div class="titlebar"><div class="dots"><i></i><i></i><i></i></div>
        <div class="title">{{ application.name }}</div></div>
      <div class="body">
        <div class="closed">Session ended.</div>
        <div
          id="terminal"
          class="textual-terminal"
          data-session-websocket-url="{{ app_websocket_url }}"
          data-font-size="{{ font_size }}"
        ></div>
      </div>
    </div>
    <script>
      (function () {
        var s = window.__qswapSize, t = document.getElementById("terminal"), w = document.getElementById("window");
        t.style.width = s.w + "px"; t.style.height = s.h + "px"; w.style.width = (s.w + 24) + "px";
        // Keystrokes reach xterm.js only through its helper textarea: keep it
        // focused, so scripted keys (recordings) land in the app.
        var timer = setInterval(function () {
          var ta = document.querySelector(".xterm-helper-textarea");
          if (ta && document.body.classList.contains("-first-byte")) {
            if (document.activeElement !== ta) ta.focus();
          }
        }, 200);
        window.addEventListener("beforeunload", function () { clearInterval(timer); });
      })();
    </script>
  </body>
</html>
